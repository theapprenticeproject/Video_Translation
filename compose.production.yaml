services:
  redis:
    ports: []

  backend:
    ports: []
  
  frontend:
    profiles:
      - dev-only

  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: prod         # ← multi-stage: builds React app, copies dist/ into nginx image
      args:
        # Empty = relative URLs; nginx proxies /api → backend:8000 internally
        VITE_API_SERVER_URL: ""
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certs — mount from host (e.g. Certbot/Let's Encrypt):
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
