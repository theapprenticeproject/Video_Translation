# nginx/prod.conf
# Single config file for production — nginx serves pre-built React dist/
# and proxies /api/* to the FastAPI backend.

server{
    listen 80;
    listen [::]:80;

    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]443 ssl;
    http2_on;

    server_name yourdomain.com;
    
    ssl_certificate /path/to/your/fullchain.pem;
    ssl_certificate_key /path/to/your/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    

    # ── Static React app ──────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # SPA fallback — all unmatched paths serve index.html
        try_files $uri $uri/ /index.html;

        # Cache fingerprinted assets aggressively; don't cache index.html
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ── FastAPI backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads (GCS signed-URL requests carry filenames, not files —
        # but set generous limit anyway for future flexibility)
        client_max_body_size 200m;

        # Long timeout for pipeline endpoints that wait on RQ jobs
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}
